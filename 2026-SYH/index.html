<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>2026년 안과 지역의사집담회 송년회</title>

  <meta name="theme-color" content="#1b2a4a">

  <!-- 카카오톡·문자 링크 미리보기 (Open Graph) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="연세대학교 의과대학 안과학교실">
  <meta property="og:title" content="2026년 안과 지역의사집담회 송년회">
  <meta property="og:description" content="2026년 11월 10일(화) 오후 7시 · 우마주블랙 도곡점">
  <meta property="og:image" content="https://yonsei-ohthalmology-invitation.vercel.app/2026-SYH/assets/og.jpg?v=2">
  <meta property="og:image:secure_url"
    content="https://yonsei-ohthalmology-invitation.vercel.app/2026-SYH/assets/og.jpg?v=2">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://yonsei-ohthalmology-invitation.vercel.app/">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="2026년 안과 지역의사집담회 송년회">
  <meta name="twitter:description" content="2026년 11월 10일(화) 오후 7시 · 우마주블랙 도곡점">
  <meta name="twitter:image" content="https://yonsei-ohthalmology-invitation.vercel.app/2026-SYH/assets/og.jpg?v=2">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+KR:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --navy: #1b2a4a;
      --navy-deep: #121d36;
      --ink: #1d2742;
      --gold: #b38a55;
      --gold-soft: #d9c19a;
      --gold-pale: #efe4d0;
      --paper: #fbf9f5;
      --card: #f5efe5;
      --muted: #6b6f7a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      -webkit-text-size-adjust: 100%
    }

    body {
      background: #e9e4da;
      font-family: "Noto Serif KR", serif;
      color: var(--ink);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 480px;
      background: var(--paper);
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(20, 30, 55, .12);
    }

    /* ── Header (navy arch) ── */
    .hero {
      position: relative;
      background: radial-gradient(120% 90% at 50% 0%, #24365c 0%, var(--navy) 55%, var(--navy-deep) 100%);
      padding: 42px 24px 92px;
      text-align: center;
      color: #fff;
    }

    .hero svg.lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none
    }

    .logo {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      display: block;
      margin: 0 auto 16px;
      opacity: 1.0;
    }

    .logo.rise {
      animation: rise-logo .9s ease forwards;
    }

    @keyframes rise-logo {
      to {
        opacity: 1.0;
        transform: none;
      }
    }

    .uni {
      font-family: "Cormorant Garamond", serif;
      font-weight: 600;
      letter-spacing: .14em;
      font-size: 22px
    }

    .col {
      font-family: "Cormorant Garamond", serif;
      letter-spacing: .32em;
      font-size: 11px;
      opacity: .85;
      margin-top: 6px
    }

    .spark {
      position: absolute;
      color: var(--gold-soft);
      animation: twinkle 3.2s ease-in-out infinite
    }

    .spark svg {
      display: block
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: .35;
        transform: scale(.85)
      }

      50% {
        opacity: 1;
        transform: scale(1)
      }
    }

    /* paper arch overlapping the header */
    .arch {
      position: relative;
      margin-top: -64px;
      background: var(--paper);
      border-radius: 50% 50% 0 0 / 64px 64px 0 0;
      border-top: 1.5px solid var(--gold-soft);
      padding: 44px 26px 28px;
      text-align: center;
    }

    .leaf {
      position: absolute;
      pointer-events: none;
      opacity: .9
    }

    .leaf.l {
      left: -6px;
      top: 150px;
      width: 64px
    }

    .leaf.r {
      right: -6px;
      top: 300px;
      width: 66px
    }

    .arch>*:not(.leaf) {
      position: relative;
      z-index: 1
    }

    .year {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: .02em
    }

    h1 {
      font-size: clamp(34px, 10.4vw, 46px);
      font-weight: 900;
      letter-spacing: -.01em;
      line-height: 1.25;
      margin-top: 6px
    }

    .title-img {
      margin: 0 auto;
      max-width: 330px
    }

    .title-img img {
      display: block;
      width: 100%;
      height: auto
    }

    .gold-title {
      font-size: clamp(40px, 12.5vw, 56px);
      font-weight: 900;
      line-height: 1.15;
      background: linear-gradient(180deg, #c9a46e 0%, #a7793f 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    .msg {
      font-family: "Noto Sans KR", sans-serif;
      font-size: 15.5px;
      line-height: 1.9;
      color: #3a3f4d;
      margin: 35px 0 0;
      word-break: keep-all
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 28px auto 26px;
      color: var(--gold)
    }

    .divider i {
      display: block;
      width: 72px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-soft))
    }

    .divider i:last-child {
      transform: scaleX(-1)
    }

    /* info pills */
    .info {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left
    }

    .pill {
      display: flex;
      align-items: center;
      background: var(--card);
      border-radius: 20px;
      padding: 13px 18px;
      min-height: 84px;
      box-sizing: border-box;
      box-shadow: inset 0 0 0 1px rgba(179, 138, 85, .12);
    }

    .pill .ic {
      width: 28px;
      color: var(--gold);
      flex: none;
      display: flex;
      justify-content: center
    }

    .pill .lab {
      width: 48px;
      font-weight: 700;
      font-size: 16px;
      padding-left: 8px;
      margin-right: 10px;
      flex: none;
      color: var(--navy)
    }

    .pill .bar {
      width: 1px;
      align-self: stretch;
      background: var(--gold-soft);
      margin: 2px 14px 2px 4px;
      flex: none
    }

    .pill .val {
      flex: 1;
      line-height: 1.35;
      margin-left: 10px;
    }

    /* 일시 폰트 스타일 */
    .pill:first-child .val {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
    }

    .pill:first-child .val .date-time {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #505565;
      margin-top: 3px;
    }

    /* 장소 폰트 스타일 */
    .pill:nth-child(2) .val {
      font-size: 16px;
      font-weight: 700;
      color: var(--navy);
    }

    .pill .sub {
      display: block;
      font-family: "Noto Sans KR", sans-serif;
      font-weight: 400;
      font-size: 11.5px;
      line-height: 1.35;
      color: var(--muted);
      margin-top: 3px;
      word-break: keep-all;
      white-space: pre-line;
      letter-spacing: -0.01em;
    }

    /* countdown */
    .count {
      margin: 45px 0 0;
      margin-bottom: 45px;
    }

    .count .t {
      font-size: 13px;
      color: var(--gold);
      letter-spacing: .2em;
      font-family: "Cormorant Garamond", serif;
      font-weight: 600
    }

    .count .row {
      display: flex;
      justify-content: center;
      gap: 11px;
      margin-top: 16px
    }

    .count .box {
      width: 66px;
      padding: 11px 0 9px;
      border: 1px solid var(--gold-pale);
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 4px 14px rgba(27, 42, 74, .04)
    }

    .count b {
      display: block;
      font-size: 23px;
      font-weight: 700;
      color: var(--navy);
      font-variant-numeric: tabular-nums
    }

    .count small {
      font-family: "Noto Sans KR", sans-serif;
      font-size: 11px;
      color: var(--muted)
    }

    .count .done {
      font-size: 15px;
      color: var(--navy);
      margin-top: 10px
    }

    /* buttons */
    .btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 42px 0 0;
      margin-bottom: -30px;
    }

    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      font-family: "Noto Sans KR", sans-serif;
      font-size: 15px;
      font-weight: 600;
      padding: 15px 12px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: transform .12s ease, opacity .2s, box-shadow .2s
    }

    .btn:active {
      transform: scale(.97)
    }

    .btn.primary {
      background: var(--navy);
      color: #fff;
      box-shadow: 0 4px 14px rgba(27, 42, 74, .18)
    }

    .btn.ghost {
      background: #fff;
      color: var(--navy);
      box-shadow: inset 0 0 0 1px var(--gold-soft), 0 2px 8px rgba(179, 138, 85, .08)
    }

    .btn.wide {
      grid-column: 1/-1
    }

    .btn[hidden] {
      display: none
    }

    /* campus */
    .campus {
      position: relative;
      margin-top: 64px
    }

    .campus img {
      width: 100%;
      display: block;
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 32%);
      mask-image: linear-gradient(180deg, transparent 0%, #000 32%)
    }

    .foot {
      font-family: "Noto Sans KR", sans-serif;
      text-align: center;
      font-size: 12px;
      color: #9a9caa;
      padding: 6px 0 26px;
      background: #fcf8f3
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%, 20px);
      background: rgba(27, 42, 74, .94);
      color: #fff;
      font-family: "Noto Sans KR", sans-serif;
      font-size: 14px;
      padding: 11px 18px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 1100
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0)
    }

    /* entrance animation */
    .rise {
      opacity: 0;
      transform: translateY(14px);
      animation: rise .9s ease forwards
    }

    @keyframes rise {
      to {
        opacity: 1;
        transform: none
      }
    }

    @media (prefers-reduced-motion:reduce) {
      .logo {
        opacity: 0.8;
      }

      .rise,
      .spark {
        animation: none;
        opacity: 1;
        transform: none
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <!-- ===== Header ===== -->
    <header class="hero">
      <svg class="lines" viewBox="0 0 480 330" preserveAspectRatio="none" aria-hidden="true">
        <g fill="none" stroke="#c9a46e" stroke-opacity=".55" stroke-width="1">
          <path d="M-20 300 Q 60 20 250 -20" />
          <path d="M500 300 Q 420 20 230 -20" />
          <path d="M-30 250 Q 40 210 120 260" />
          <path d="M510 250 Q 440 210 360 260" />
        </g>
      </svg>
      <span class="spark" style="left:12%;top:38%;animation-delay:.2s"><svg width="26" height="26" viewBox="0 0 24 24">
          <path fill="currentColor" d="M12 0l1.6 10.4L24 12l-10.4 1.6L12 24l-1.6-10.4L0 12l10.4-1.6z" />
        </svg></span>
      <span class="spark" style="right:13%;top:28%;animation-delay:1.1s"><svg width="30" height="30"
          viewBox="0 0 24 24">
          <path fill="currentColor" d="M12 0l1.6 10.4L24 12l-10.4 1.6L12 24l-1.6-10.4L0 12l10.4-1.6z" />
        </svg></span>
      <span class="spark" style="left:18%;top:14%;animation-delay:2s"><svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="currentColor" d="M12 0l1.6 10.4L24 12l-10.4 1.6L12 24l-1.6-10.4L0 12l10.4-1.6z" />
        </svg></span>

      <img class="logo rise" src="assets/logo.png" alt="연세대학교">
      <div class="uni rise" style="animation-delay:.15s">YONSEI UNIVERSITY</div>
      <div class="col rise" style="animation-delay:.25s">COLLEGE OF MEDICINE</div>
    </header>

    <!-- ===== Body ===== -->
    <section class="arch">
      <img class="leaf l" src="assets/leaf-left.png" alt="" aria-hidden="true">
      <img class="leaf r" src="assets/leaf-right.png" alt="" aria-hidden="true">

      <h1 class="title-img rise" style="animation-delay:.4s">
        <img src="assets/title.png" alt="2026년 안과 지역의사집담회 송년회">
      </h1>

      <p class="msg rise" style="animation-delay:.7s">
        한 해를 함께해 주신 선생님께 감사드리며,<br>
        2026년 안과 지역의사집담회 송년회를<br>개최하고자 합니다.<br>
        뜻깊은 자리에 함께해 주시길 바랍니다.
      </p>

      <div class="divider" aria-hidden="true"><i></i>
        <svg width="14" height="14" viewBox="0 0 24 24">
          <path fill="currentColor" d="M12 0l1.6 10.4L24 12l-10.4 1.6L12 24l-1.6-10.4L0 12l10.4-1.6z" />
        </svg>
        <i></i>
      </div>

      <div class="info">
        <div class="pill">
          <span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round">
              <rect x="3" y="5" width="18" height="16" rx="3" />
              <path d="M8 3v4M16 3v4M3 10h18" />
              <circle cx="8" cy="14" r=".6" fill="currentColor" />
              <circle cx="12" cy="14" r=".6" fill="currentColor" />
              <circle cx="16" cy="14" r=".6" fill="currentColor" />
              <circle cx="8" cy="17.5" r=".6" fill="currentColor" />
              <circle cx="12" cy="17.5" r=".6" fill="currentColor" />
            </svg></span>
          <span class="lab">일시</span><span class="bar"></span>
          <span class="val">2026년 11월 10일(화)<span class="date-time">오후 7시</span></span>
        </div>
        <div class="pill">
          <span class="ic"><svg width="22" height="26" viewBox="0 0 24 28">
              <path fill="currentColor"
                d="M12 0C5.4 0 0 5.2 0 11.6 0 20.3 12 28 12 28s12-7.7 12-16.4C24 5.2 18.6 0 12 0zm0 16a4.4 4.4 0 1 1 0-8.8 4.4 4.4 0 0 1 0 8.8z" />
            </svg></span>
          <span class="lab">장소</span><span class="bar"></span>
          <span class="val" id="placeName">우마주블랙 도곡점<span class="sub" id="placeSub">서울 강남구 도곡로 226
              선일빌딩 1층</span></span>
        </div>
      </div>

      <div class="count" id="count">
        <div class="t">COUNTDOWN</div>
        <div class="row">
          <div class="box"><b id="dd">-</b><small>일</small></div>
          <div class="box"><b id="hh">-</b><small>시간</small></div>
          <div class="box"><b id="mm">-</b><small>분</small></div>
          <div class="box"><b id="ss">-</b><small>초</small></div>
        </div>
      </div>

      <div class="btns">
        <a class="btn primary" id="mapBtn" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z" />
            <circle cx="12" cy="10" r="2.5" />
          </svg>네이버 지도</a>
        <button class="btn ghost" id="shareBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <circle cx="18" cy="5" r="3" />
            <circle cx="6" cy="12" r="3" />
            <circle cx="18" cy="19" r="3" />
            <path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4" />
          </svg>공유하기</button>
        <a class="btn ghost wide" id="rsvpBtn" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <path d="M20 6L9 17l-5-5" />
          </svg>참석 회신</a>
      </div>
    </section>

    <div class="campus"><img src="assets/campus.jpg" alt="연세대학교 의과대학 캠퍼스 일러스트"></div>
    <div class="foot">연세대학교 의과대학 안과학교실</div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    /* ============================================
       ✏️ 여기만 수정하면 됩니다
       ============================================ */
    const CONFIG = {
      title: "2026년 안과 지역의사집담회 송년회",
      start: "2026-11-10T19:00:00+09:00",   // 시작
      end: "2026-11-10T21:30:00+09:00",   // 종료
      placeName: "우마주블랙 도곡점",             // 장소 이름
      placeSub: "서울 강남구 도곡로 226\n선일빌딩 1층", // 주소 (\n = 줄바꿈)
      mapUrl: "https://naver.me/xYN9E1Mi",    // 지도 버튼 링크
      rsvpUrl: ""                              // 구글폼 등 회신 링크 (비워두면 버튼 숨김)
    };
    /* ============================================ */

    const $ = id => document.getElementById(id);
    $('placeName').firstChild.textContent = CONFIG.placeName;
    $('placeSub').textContent = CONFIG.placeSub;
    if (!CONFIG.placeSub) $('placeSub').hidden = true;
    $('mapBtn').href = CONFIG.mapUrl;
    if (CONFIG.rsvpUrl) $('rsvpBtn').href = CONFIG.rsvpUrl;
    else $('rsvpBtn').hidden = true;

    function toast(msg) {
      const t = $('toast'); t.textContent = msg; t.classList.add('show');
      clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2000);
    }

    /* countdown */
    const target = new Date(CONFIG.start).getTime();
    function tick() {
      let d = target - Date.now();
      if (d <= 0) {
        $('count').innerHTML = '<div class="t">THANK YOU</div><p class="done">함께해 주셔서 감사합니다</p>';
        return clearInterval(timer);
      }
      const pad = n => String(n).padStart(2, '0');
      $('dd').textContent = Math.floor(d / 864e5);
      $('hh').textContent = pad(Math.floor(d / 36e5) % 24);
      $('mm').textContent = pad(Math.floor(d / 6e4) % 60);
      $('ss').textContent = pad(Math.floor(d / 1e3) % 60);
    }
    const timer = setInterval(tick, 1000); tick();

    /* share */
    $('shareBtn').onclick = async () => {
      const data = { title: CONFIG.title, text: '11월 10일(화) 오후 7시 · ' + CONFIG.title, url: location.href };
      try {
        if (navigator.share) return await navigator.share(data);
        await navigator.clipboard.writeText(location.href); toast('링크가 복사되었습니다');
      } catch (e) {
        if (e && e.name === 'AbortError') return;
        prompt('아래 링크를 복사해 주세요', location.href);
      }
    };
  </script>
</body>

</html>
